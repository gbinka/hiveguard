[package]
name = "hiveguard-plugin-utils"
version = "0.1.0"
edition = "2021"
description = "Shared utilities for HiveGuard plugin authors — HTTP client, retry, backoff, templates, rate limiting"

[dependencies]
hiveguard-plugin-api = { path = "../hiveguard-plugin-api" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
rand = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
