[package]
name = "hiveguard-ui"
version = "0.1.0"
edition = "2021"
description = "Render-agnostic UI library for HiveGuard — model/update/view used by ui-tui and ui-web"

# This crate is designed to compile to both native (for ui-tui via ratatui)
# and WASM (for ui-web via Leptos/Dioxus). Avoid platform-specific deps.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
ipnet = { version = "2", features = ["serde"] }

[dev-dependencies]
