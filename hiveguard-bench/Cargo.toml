[package]
name = "hiveguard-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
hiveguard-core = { path = "../hiveguard-core" }
hiveguard-ingest = { path = "../hiveguard-ingest" }
hiveguard-enforce = { path = "../hiveguard-enforce" }
chrono = "0.4"
ipnet = "2"
tokio = { version = "1", features = ["full"] }
rand = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "parser_throughput"
harness = false

[[bench]]
name = "ban_lookup"
harness = false

# [[bench]] scoring_throughput removed in Stage 3 of INT — scoring is now a
# plugin. See obsolete/scoring_throughput_bench.rs for the legacy version. A
# new bench targeting `ScoringEnginePlugin::record`/`evaluate` belongs in
# `plugins/scoring-default/benches/` once that crate gains a benches/ dir.

[[bench]]
name = "enforcement_batch"
harness = false
