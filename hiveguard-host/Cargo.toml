[package]
name = "hiveguard-host"
version = "0.1.0"
edition = "2021"
description = "Plugin runtime for HiveGuard — discovers, validates, instantiates and supervises plugins"

[dependencies]
hiveguard-plugin-api = { path = "../hiveguard-plugin-api" }
hiveguard-config = { path = "../hiveguard-config" }
hiveguard-core = { path = "../hiveguard-core" }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
tokio-util = "0.7"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
prometheus-client = "0.23"
ipnet = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
once_cell = "1"
