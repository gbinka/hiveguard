[package]
name = "hiveguard-plugin-api"
version = "0.1.0"
edition = "2021"
description = "Stable plugin contract for HiveGuard — traits, manifest, registry, context"

[dependencies]
hiveguard-core = { path = "../hiveguard-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
inventory = "0.3"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
tokio-util = "0.7"
ipnet = "2"
chrono = { version = "0.4", features = ["serde"] }
jsonschema = { version = "0.18", default-features = false }
prometheus-client = "0.23"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serde_yaml = "0.9"
