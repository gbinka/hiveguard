[package]
name = "hiveguard-queue"
version = "0.1.0"
edition = "2021"
description = "Message queue ingestion sources for HiveGuard (Phase 6)"

[features]
default = ["kafka", "kinesis", "cloudwatch", "rabbitmq", "nats"]
kafka = ["dep:rdkafka"]
kinesis = ["dep:aws-sdk-kinesis", "dep:aws-config", "dep:aws-credential-types"]
cloudwatch = ["dep:aws-sdk-cloudwatchlogs", "dep:aws-config", "dep:aws-credential-types"]
rabbitmq = ["dep:lapin"]
nats = ["dep:async-nats"]

[dependencies]
hiveguard-core = { path = "../hiveguard-core" }
hiveguard-ingest = { path = "../hiveguard-ingest" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Apache Kafka — optional, enabled by default via "kafka" feature
rdkafka = { version = "0.36", features = ["cmake-build"], optional = true }

# RabbitMQ AMQP 0-9-1 — optional, enabled by default via "rabbitmq" feature
lapin = { version = "2", optional = true }
# futures-lite is a transitive dep of lapin; declared explicitly for StreamExt in rabbitmq.rs
futures-lite = "2"

# NATS / JetStream — optional, enabled by default via "nats" feature
async-nats = { version = "0.35", optional = true }
# futures StreamExt for NATS subscriber/JetStream message streams
futures = { version = "0.3", default-features = false, features = ["std"] }

# AWS SDK — optional, enabled by default via "kinesis"/"cloudwatch" features
aws-config = { version = "=1.8.11", optional = true }
aws-sdk-kinesis = { version = "=1.92.0", optional = true }
aws-sdk-cloudwatchlogs = { version = "=1.105.0", optional = true }
aws-credential-types = { version = "=1.2.10", features = ["hardcoded-credentials"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
