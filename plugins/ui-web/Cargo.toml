[package]
name = "hiveguard-ui-web"
version = "0.1.0"
edition = "2021"
description = "HiveGuard Web UI — Leptos SPA renderer + UiServer plugin (Phase 5 scaffold)"

# This crate compiles to two targets:
#
#   1. `cargo build -p hiveguard-ui-web`                          → native lib
#      Exposes the `UiServerPlugin` impl (`WebPlugin`) registered via
#      `inventory::submit!`. The host loads this and serves the prebuilt
#      WASM artefacts from `dist/` (built separately with Trunk).
#
#   2. `cargo build -p hiveguard-ui-web --target wasm32-unknown-unknown`
#      Builds the `hiveguard-ui-web` binary target — the Leptos SPA
#      itself. `trunk build` invokes this and bundles the result into
#      `dist/` alongside `index.html` + `style.css`.
#
# Dependencies are `cfg`-gated by target so wasm-only crates (gloo-net,
# web-sys, leptos) don't pollute the native build, and tokio doesn't
# pollute the wasm build.

[lib]
crate-type = ["rlib"]

[[bin]]
name = "hiveguard-ui-web"
path = "src/web/main.rs"
# The wasm bin can technically be built natively, but it's not useful;
# Trunk drives the wasm build. Native check passes because the entry
# is `cfg(target_arch = "wasm32")`-gated.

# --- Shared deps (work on both native and wasm) ---
[dependencies]
hiveguard-ui = { path = "../../hiveguard-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Native-only: plugin host integration ---
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hiveguard-plugin-api = { path = "../../hiveguard-plugin-api" }
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }

# --- Wasm-only: Leptos + browser bindings ---
[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "Event",
    "BinaryType",
    "Window",
    "Location",
] }
gloo-net = { version = "0.6", features = ["websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
futures = "0.3"
