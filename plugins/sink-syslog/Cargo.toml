[package]
name = "hiveguard-plugin-sink-syslog"
version = "0.1.0"
edition = "2021"
description = "RFC 5424 syslog forwarder sink for HiveGuard events (TCP/UDP)"

[dependencies]
hiveguard-plugin-api = { path = "../../hiveguard-plugin-api" }
hiveguard-core = { path = "../../hiveguard-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "macros"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
