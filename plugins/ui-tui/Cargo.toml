[package]
name = "hiveguard-plugin-ui-tui"
version = "0.1.0"
edition = "2021"
description = "UI TUI plugin for HiveGuard — ratatui renderer over hiveguard-ui"

# Standalone binary: the primary entry-point. Operators run this against a
# remote daemon; the plugin-side surface (lib.rs) is for in-process embedding.
[[bin]]
name = "hiveguard-tui"
path = "src/bin/hiveguard-tui.rs"

[dependencies]
hiveguard-plugin-api = { path = "../../hiveguard-plugin-api" }
hiveguard-ui          = { path = "../../hiveguard-ui" }

# TUI runtime.
ratatui    = "0.28"
crossterm  = { version = "0.28", features = ["event-stream"] }

# Async runtime.
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "io-util", "time", "signal"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# REST client (rustls so we don't drag in OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# CLI.
clap = { version = "4", features = ["derive", "env"] }

# Misc.
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
async-trait = "0.1"
anyhow      = "1"
