[package]
name = "hiveguard-plugin-notifier-webhook"
version = "0.1.0"
edition = "2021"
description = "Generic HTTP webhook notifier for HiveGuard alerts"

[dependencies]
hiveguard-plugin-api = { path = "../../hiveguard-plugin-api" }
hiveguard-plugin-utils = { path = "../../hiveguard-plugin-utils" }
hiveguard-core = { path = "../../hiveguard-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync"] }
ipnet = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "=0.6.2"
