[package]
name = "hiveguard-plugin-source-kafka"
version = "0.1.0"
edition = "2021"
description = "Apache Kafka log source plugin for HiveGuard"

[dependencies]
hiveguard-plugin-api = { path = "../../hiveguard-plugin-api" }
hiveguard-core = { path = "../../hiveguard-core" }
hiveguard-ingest = { path = "../../hiveguard-ingest" }
hiveguard-queue = { path = "../../hiveguard-queue", default-features = false, features = ["kafka"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
