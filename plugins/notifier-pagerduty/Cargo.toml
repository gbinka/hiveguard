[package]
name = "hiveguard-plugin-notifier-pagerduty"
version = "0.1.0"
edition = "2021"
description = "Pagerduty notifier for HiveGuard (scaffold)"

[dependencies]
hiveguard-plugin-api = { path = "../../hiveguard-plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
